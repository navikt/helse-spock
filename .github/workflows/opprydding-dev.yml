name: main - opprydding-dev - build, test and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'opprydding-dev/**'
      - 'deploy/opprydding-dev.yml'
      - 'deploy/dev-db-policy.yml'
      - '.github/workflows/opprydding-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25.x'
          cache: 'gradle'
      - name: test and build cleanup module
        run: ./gradlew :opprydding-dev:test :opprydding-dev:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: meta
        run: echo "image=ghcr.io/${{ github.repository_owner }}/spock-opprydding-dev:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: build docker image for module
        uses: docker/build-push-action@v6
        with:
          context: ./opprydding-dev
          file: ./opprydding-dev/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spock-opprydding-dev:${{ github.sha }}

  deployDev:
    name: deploy to dev
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: deploy/opprydding-dev.yml,deploy/dev-db-policy.yml
          IMAGE: ${{ needs.build.outputs.image }}