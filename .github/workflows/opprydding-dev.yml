name: main - opprydding-dev - build, test and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'opprydding-dev/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/opprydding-dev.yml'
      - 'deploy/dev-db-policy.yml'
      - '.github/workflows/opprydding-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25.x'
          cache: 'gradle'
      - name: test and build cleanup module
        run: ./gradlew :opprydding-dev:test :opprydding-dev:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build docker image for module
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: tbd
          docker_context: .
          dockerfile: ./Dockerfile
          build_args: |
            MODULE=opprydding-dev
          image_suffix: opprydding-dev

  deployDev:
    name: deploy to dev
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: deploy/opprydding-dev.yml,deploy/dev-db-policy.yml
          IMAGE: ${{ needs.build.outputs.image }}