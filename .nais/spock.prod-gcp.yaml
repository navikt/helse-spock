spec:
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 4Gi
    requests:
      cpu: 50m
  replicas:
    min: 2
    max: 5
    cpuThresholdPercentage: 50
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-custom-4-15360
        name: spock
        databases:
          - name: spock
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  kafka:
    pool: nav-prod
  env:
    - name: KAFKA_RESET_POLICY
      value: none
